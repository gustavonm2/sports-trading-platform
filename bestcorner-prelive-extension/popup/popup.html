<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 12px;
      margin: 0;
      background: #0f172a;
      color: #f1f5f9;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }
    .title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #3b82f6;
    }
    .desc {
      font-size: 0.78rem;
      color: #94a3b8;
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 800;
      background: rgba(16, 185, 129, 0.1);
      color: #10b981;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .status {
      margin-top: 10px;
      background: #1e293b;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 1.2rem;">📊</span>
    <span class="title">BestCorner Pré-Live</span>
    <span class="badge">ATIVO</span>
  </div>
  <p class="desc">
    Abra qualquer página de estatísticas (Destaques ou Filtros e Ordenação) no <b>BestCornerStats</b>. O painel flutuante aparecerá no canto inferior direito para você escanear e sincronizar os dados diários com o TradePro.
  </p>
  <div class="status">
    <b>Status:</b> Pronto para escanear tabelas na aba ativa.
  </div>
</body>
</html>
